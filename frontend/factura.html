<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de Venta - Tienda Gamer Lr</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="factura-body">
    <div class="header">
        <div>
            <h2 class="store-title">TIENDA GAMER LR</h2>
            <p class="store-subtitle">Sistema de Gestión Comercial</p>
        </div>
        <div class="invoice-details">
            <h3 class="invoice-title">FACTURA OFICIAL</h3>
            <p class="invoice-number" id="factura-nro">Nro: Cargando...</p>
            <p class="invoice-date" id="factura-fecha">Fecha: ...</p>
        </div>
    </div>

    <div class="box">
        <div class="section-title">Datos del Comprador</div>
        <p><strong>Cliente:</strong> <span id="cli-nombre">-</span></p>
        <p><strong>DNI:</strong> <span id="cli-dni">-</span></p>
        <p><strong>Email:</strong> <span id="cli-email">-</span> | <strong>Teléfono:</strong> <span id="cli-telefono">-</span></p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Descripción del Comprobante</th>
                <th class="text-right">Importe Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Venta de Artículos / Periféricos Gaming</td>
                <td class="text-right-bold" id="factura-total">$0.00</td>
            </tr>
        </tbody>
    </table>

    <div class="total-row" id="factura-total-general">
        TOTAL GENERAL: $0.00
    </div>

    <button class="print-btn" onclick="window.print()">Imprimir / Guardar como PDF</button>

    <script>
        async function cargarDetalle() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const token = localStorage.getItem("token");

            if (!id) {
                alert("No se indicó el ID de la factura.");
                return;
            }

            try {
                const res = await fetch(`http://127.0.0.1:8000/ventas/facturas/${id}/detalle`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (!res.ok) throw new Error("Error al obtener datos");
                
                const f = await res.json();
                
                document.getElementById("factura-nro").innerText = `Nro: #${f.id_factura}`;
                document.getElementById("factura-fecha").innerText = `Fecha: ${new Date(f.fecha).toLocaleString()}`;
                document.getElementById("cli-nombre").innerText = f.cliente.nombre;
                document.getElementById("cli-dni").innerText = f.cliente.dni;
                document.getElementById("cli-email").innerText = f.cliente.email;
                document.getElementById("cli-telefono").innerText = f.cliente.telefono;
                document.getElementById("factura-total").innerText = `$${f.total.toLocaleString()}`;
                document.getElementById("factura-total-general").innerText = `TOTAL GENERAL: $${f.total.toLocaleString()}`;
            } catch (err) {
                console.error(err);
                alert("No se pudo cargar el comprobante.");
            }
        }
        cargarDetalle();
    </script>
</body>
</html>
